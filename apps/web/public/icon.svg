<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Beat">
  <!--
    Beat işareti — kesintisiz bir nabız/dalga. Beş dikey kol, dönüşlerde tam
    yarım daire; iki uç yatay kısa kuyruk (dalga devam ediyor duygusu).

    ZEMİN TAM BEYAZ, işaret siyah. Eskiden zemin saydamdı ve işaret koyu
    sekmede kaybolmasın diye siyah yolun altına daha kalın beyaz bir stroke
    çiziliyordu (kendi kendine bordür). Beyaz plaka bu işi zaten yapıyor:
    çift çizim kalktı, tek siyah stroke kaldı.

    İşaret plakaya göre büyütüldü (ölçek 1.24, kutunun merkezine oturtularak):
    16 pikselde sekmede okunan şey yolun kalınlığı, çevresindeki boşluk değil.

    Renkler currentColor DEĞİL sabit: PNG türevlerinde de aynı görünsün.
  -->
  <rect width="500" height="500" fill="#ffffff"/>
  <g fill="none" stroke="#000000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(250 250) scale(1.24) translate(-250 -240)">
    <path d="M 88 265 L 98 265
             A 30 30 0 0 0 128 235
             L 128 175
             A 30 30 0 0 1 188 175
             L 188 355
             A 30 30 0 0 0 248 355
             L 248 125
             A 30 30 0 0 1 308 125
             L 308 300
             A 30 30 0 0 0 368 300
             L 368 240
             A 30 30 0 0 1 398 210
             L 412 210"/>
  </g>
</svg>
