name: Fiyat Çek + Snapshot (saatlik)

# Motor: fiyatları çeker (prices/fx_rates) ve hemen ardından portföy snapshot'ı alır.
# BULUTTAN çalışır -> Mac kapalıyken de veri toplanır (projenin özü).
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'    # her 10 dk (public repo = sınırsız Actions dk; GH drop'larına karşı 6x/saat, pratikte hiç kaçmaz)

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci || npm install
      - name: Fiyatları çek
        run: npm run fetch hourly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      - name: Snapshot al
        run: npm run snapshot hourly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
