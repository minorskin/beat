name: Fiyat Çek (saatlik)

# Motor: aktif enstrümanların fiyatını çekip prices/fx_rates'e yazar.
# BULUTTAN çalışır -> Mac kapalıyken de veri toplanır (projenin özü).
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'    # her saat :07 (GH cron 15-30 dk sapabilir)

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci || npm install
      - run: npm run fetch hourly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
